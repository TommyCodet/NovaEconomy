prefix: "<dark_gray>[<gradient:#7c3aed:#22d3ee>NovaEconomy</gradient>]</dark_gray> "

no-permission: "<red>Dafür fehlt dir die Berechtigung.</red>"
players-only: "<red>Dieser Befehl kann nur von Spielern verwendet werden.</red>"
invalid-number: "<red>Ungültige Zahl: <value></red>"
