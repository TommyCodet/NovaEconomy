  created: "<green>Auftrag #<id> erstellt:</green> <amount>x <material> zu <unit_price> pro Stück. Reserviert: <total>."
  insufficient-funds: "<red>Dein Guthaben reicht nicht aus. Benötigt: <required>, vorhanden: <balance>.</red>"
  limit-reached: "<red>Du hast bereits die maximal erlaubte Zahl aktiver Aufträge.</red>"
  invalid-amount: "<red>Die Anzahl muss zwischen 1 und <max> liegen.</red>"
  invalid-price: "<red>Der Preis pro Stück muss größer als 0 sein.</red>"
  not-found: "<red>Auftrag #<id> wurde nicht gefunden.</red>"
  not-owner: "<red>Dieser Auftrag gehört dir nicht.</red>"
  not-active: "<red>Dieser Auftrag ist nicht mehr aktiv.</red>"
  cancelled: "<green>Auftrag #<id> abgebrochen. Rückerstattet: <refund>.</green>"
  nothing-to-collect: "<yellow>Es liegen keine gelieferten Items zur Abholung bereit.</yellow>"
  collected: "<green>Abgeholt:</green> <items> Items aus <orders> Auftrag/Aufträgen."
  search-empty: "<yellow>Du besitzt keine passenden Items für aktuell aktive Aufträge.</yellow>"
  delivery-success: "<green>Geliefert:</green> <amount>x <material> für <payout> an Auftrag #<id>."
  delivery-failed: "<red>Die Lieferung konnte nicht verbucht werden.</red>"
  own-order: "<red>Du kannst deinen eigenen Auftrag nicht beliefern.</red>"

money:
  balance: "<green>Kontostand von <player>:</green> <balance>"
  pay-success: "<green>Du hast <player> <amount> überwiesen.</green>"
  pay-received: "<green>Du hast von <player> <amount> erhalten.</green>"
  pay-self: "<red>Du kannst dir nicht selbst Geld überweisen.</red>"
  insufficient-funds: "<red>Dein Guthaben reicht nicht aus.</red>"
  player-not-found: "<red>Spieler <player> wurde nicht gefunden.</red>"
  admin-success: "<green>Kontostand von <player> geändert. Neuer Stand: <balance>.</green>"
  usage: "<yellow>Verwendung:</yellow> /money [balance [spieler]] | /money pay <spieler> <betrag> | /money admin <set|add|take> <spieler> <betrag>"

gui:
  title: "<dark_purple>Aktive Aufträge</dark_purple>"
  order-name: "<aqua>Auftrag #<id>: <material></aqua>"
  order-lore:
    - "<gray>Auftraggeber:</gray> <white><owner></white>"
    - "<gray>Offen:</gray> <white><remaining> / <requested></white>"
    - "<gray>Preis/Stück:</gray> <green><unit_price></green>"
    - "<gray>Möglicher Verdienst:</gray> <green><possible_payout></green>"
    - ""
    - "<yellow>Rechtsklick:</yellow> 1 Stück liefern"
    - "<yellow>Linksklick:</yellow> bis zu <click_limit> liefern"
    - "<yellow>Shift-Klick:</yellow> alles Mögliche liefern"
  previous: "<yellow>Vorherige Seite</yellow>"
  next: "<yellow>Nächste Seite</yellow>"
  info: "<aqua>Seite <page>/<pages></aqua>"
  info-lore:
    - "<gray>Filter:</gray> <white><filter></white>"
    - "<gray>Angezeigte Aufträge:</gray> <white><count></white>"
