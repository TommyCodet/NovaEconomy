name: Build NovaEconomy

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Restore source bundle
        run: |
          sed 's/archarhw/charhw/' source.part00 > source.part00.fixed
          wc -c source.part00.fixed source.part01 source.part02a source.part02b source.part03
          sha256sum source.part00.fixed source.part01 source.part02a source.part02b source.part03
          cat source.part00.fixed source.part01 source.part02a source.part02b source.part03 > source.b64
          sha256sum source.b64
          base64 --decode source.b64 > NovaEconomy-source.tar.gz
          sha256sum NovaEconomy-source.tar.gz
          mkdir project
          tar -xzf NovaEconomy-source.tar.gz -C project
      - name: Build and test
        working-directory: project/NovaEconomy
        run: mvn --batch-mode clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: NovaEconomy-jar
          path: project/NovaEconomy/target/NovaEconomy-1.1.0.jar
          if-no-files-found: error
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: NovaEconomy-source
          path: project/NovaEconomy
